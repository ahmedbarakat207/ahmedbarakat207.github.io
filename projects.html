<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
    @font-face { font-family: main_font; src: url(W95font.otf); }
    @font-face { font-family: bold_font; src: url(W95font-Bold.otf); }

    :root {
        --window-silver: #c0c0c0;
        --border-light: #ffffff;
        --border-dark: #808080;
        --border-black: #000000;
        --title-blue: #000080;
        --tag-active: #2e7d32;
        --tag-progress: #b8860b;
        --tag-done: #000080;
        --tag-dead: #b71c1c;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #ffffff;
        font-family: main_font, 'Tahoma', 'Arial', sans-serif;
        color: #000;
    }

    .explorer {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding-bottom: 36px; /* reserve space for fixed status bar */
        padding-top: 40px; /* reserve space for fixed address bar */
    }

    /* Address bar */
    .address-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--window-silver);
        border: 2px solid;
        border-color: var(--border-dark) var(--border-light) var(--border-light) var(--border-dark);
        padding: 3px 6px;
        font-size: 12px;
        flex-shrink: 0;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
    }
    .address-bar .addr-box {
        flex: 1;
        background: #fff;
        border: 2px solid;
        border-color: var(--border-dark) var(--border-light) var(--border-light) var(--border-dark);
        padding: 2px 6px;
        display: flex;
        align-items: center;
        gap: 6px;
        overflow: hidden;
        white-space: nowrap;
    }

    /* Icon grid */
    .icon-grid {
        background: #ffffff;
        padding: 22px 18px;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 26px 22px;
    }

    .icon-item {
        width: 92px;
        text-align: center;
        cursor: pointer;
        user-select: none;
    }

    .icon-item .icon-visual {
        width: 100%;
        height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 5px;
    }

    .icon-item .icon-visual img {
        max-width: 44px;
        max-height: 40px;
        object-fit: contain;
        image-rendering: pixelated;
    }

    .icon-item .icon-visual i { font-size: 30px; color: var(--title-blue); }

    .icon-item .icon-label { font-size: 11px; color: #000; line-height: 1.3; word-wrap: break-word; }

    .details-wrap { display: none; }
    .details-wrap.open { display: block; }

    .detail-card { background: #fff; padding: 16px 18px; border: 2px solid; border-color: var(--border-dark) var(--border-light) var(--border-light) var(--border-dark); }
    .detail-header { display:flex; gap:14px; align-items:flex-start; border-bottom:2px solid #000; padding-bottom:12px; margin-bottom:12px; }
    .detail-icon { width:52px; height:52px; display:flex; align-items:center; justify-content:center; }
    .detail-title h1 { font-family:bold_font; font-size:18px; margin:0 0 4px 0; color:var(--title-blue); }
    .detail-stack { font-size:11px; color:#555; font-style:italic; margin-bottom:6px; }
    .detail-tag { display:inline-block; font-size:10px; font-weight:bold; padding:2px 7px; border:1px solid; }
    .tag-active { background:#e8f5e9; border-color:var(--tag-active); color:var(--tag-active); }
    .tag-progress { background:#fff8e1; border-color:var(--tag-progress); color:#8a6d00; }
    .tag-completed { background:#e3e8ff; border-color:var(--tag-done); color:var(--tag-done); }
    .tag-discontinued { background:#fdecea; border-color:var(--tag-dead); color:var(--tag-dead); }
    .detail-body p { font-size:13px; line-height:1.55; margin:8px 0; }
    .detail-links { margin-top:14px; display:flex; gap:14px; flex-wrap:wrap; border-top:1px solid #ccc; padding-top:10px; }
    .detail-links a { font-size:12px; color:var(--title-blue); text-decoration:none; display:inline-flex; align-items:center; gap:5px; }
    .detail-links a:hover { text-decoration:underline; }

    .status-bar { flex-shrink:0; display:flex; align-items:center; gap:4px; background:var(--window-silver); border:2px solid; border-color:var(--border-dark) var(--border-light) var(--border-light) var(--border-dark); font-size:11px; padding:3px 8px; position:fixed; left:0; right:0; bottom:0; z-index:9999; box-sizing:border-box; }
    .status-bar span { border-right:1px solid var(--border-dark); padding-right:8px; margin-right:4px; }
    .status-bar span:last-child { border-right:none; }

    .float-window { position:absolute; left:60px; top:320px; width:760px; height:300px; background:var(--window-silver); border:2px solid; border-color:var(--border-light) var(--border-black) var(--border-black) var(--border-light); box-shadow:2px 2px 0 rgba(0,0,0,0.2); display:flex; flex-direction:column; z-index:1000; }
    .fw-titlebar { height:26px; background:var(--title-blue); color:white; display:flex; align-items:center; justify-content:space-between; padding:2px 6px; cursor:move; }
    .fw-title { font-family:bold_font; font-size:13px; }
    .fw-controls { display:flex; gap:6px; }
    .fw-content { padding:12px; background:#fff; border-top:2px solid var(--border-dark); flex:1; overflow:auto; }
    .fw-content .detail-card { border:none; padding:0; }

    @media (max-width:600px) {
        .icon-grid { padding:16px 12px; gap:20px 12px; justify-content:space-between; }
        .icon-item { width:27%; }
        .details-wrap { padding:12px; }
        .detail-card { padding:12px; }
        .detail-title h1 { font-size:16px; }
    }
    </style>
</head>
<body>
    <div class="explorer">

        <div class="address-bar">
            <img src="Textures/folder.png" width="18px">
            <div class="addr-box"><img src="Textures/hdd.ico" width="18px"> C:\MY_PROJECTS\</div>
        </div>
        <div class="icon-grid" id="iconGrid"></div>

        <!-- Floating detail window (hidden by default) -->
        <div class="float-window" id="detailWindow" style="display:none;">
            <div class="fw-titlebar" id="fwTitle">
                <div class="fw-title">Details</div>
                <div class="fw-controls">
                    <button id="fwClose" class="control-btn">×</button>
                </div>
            </div>
            <div class="fw-content">
                <div class="detail-card" id="detailsPane"></div>
            </div>
        </div>

        <div class="status-bar" id="statusBar">
            <span id="statCount">13 object(s)</span>
            <span id="statSelected">No selection</span>
        </div>
    </div>

    <script src="projects.js"></script>
</body>
</html>
